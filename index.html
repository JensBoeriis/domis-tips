/* Layout: domis' sorte skråstreg som gennemgående motiv; kampe til venstre, stilling til højre (stablet på mobil) */
:root{
  --paper:#f4f4f1; --surface:#ffffff; --ink:#121314; --muted:#686a6d; --line:#dcdcd7; --concrete:#e8e7e2;
  --good:#1d7447; --good-bg:#e2f1e8; --bad:#ad3a31; --bad-bg:#f7e4e1; --live:#d24a12; --live-bg:#fbe9df;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111213; --surface:#1a1b1d; --ink:#f0efea; --muted:#9c9da0; --line:#2d2e31; --concrete:#242528;
  --good:#5cc994; --good-bg:#16301f; --bad:#f07a6f; --bad-bg:#3a1e1b; --live:#ff8a52; --live-bg:#3a2216; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111213; --surface:#1a1b1d; --ink:#f0efea; --muted:#9c9da0; --line:#2d2e31; --concrete:#242528;
  --good:#5cc994; --good-bg:#16301f; --bad:#f07a6f; --bad-bg:#3a1e1b; --live:#ff8a52; --live-bg:#3a2216; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.brand{display:flex;flex-direction:column;gap:10px}
.logo{width:148px;color:var(--ink);display:block}
.title{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.6vw,40px);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.title span{color:var(--muted)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.week{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1}
.week select{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 6px;font-family:var(--f-display);font-weight:600;font-size:20px}
.upd{color:var(--muted);font-size:13px}
.group{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.strip > div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}

  return out;
}

/* ---------- render ---------- */
function render(){
  var w = weekById(view.week) || DATA.weeks[DATA.weeks.length-1];
  view.week = w.id;
  renderHeader(w); renderStrip(w); renderMe(); renderMatches(w); renderBoard(w);
}
function renderHeader(w){
  var wp=$("week-pick");
  if(DATA.weeks.length>1){
    wp.innerHTML='<label for="week-sel" class="upd" style="margin-right:6px">Kupon</label><select id="week-sel">'+DATA.weeks.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===w.id?" selected":"")+'>'+esc(x.label)+'</option>';}).join("")+'</select>';
    $("week-sel").onchange=function(e){view.week=e.target.value;render();};
  } else wp.textContent=w.label;
  var u = DATA.updated ? new Date(DATA.updated) : null;
  $("updated").textContent = u ? "Resultater opdateret "+fDay.format(u)+" kl. "+fTime.format(u) : "";
}
function renderStrip(w){
  var now=Date.now(), fin=0, live=0, next=null;
  w.matches.forEach(function(m){ var r=m.res||{};
    if(isFinal(r)) fin++; else if(isLive(r)) live++;
    else if(m.ko && r.s!=="PP" && new Date(m.ko).getTime()>now && (!next || m.ko<next.ko)) next=m; });
  var rows=standings(w.id), key = live? "prov":"fin", rk=rankBy(rows,key);
  var leaders=rows.filter(function(r){return rk[r.p]===1;});
  var leadTxt = leaders.length>3 ? leaders.length+" deler 1." : leaders.map(function(r){return r.p;}).join(", ");
  var nx = next ? esc(next.home)+" – "+esc(next.away) : (fin===w.matches.length?"Ugen er færdigspillet":"–");
  var nxs = next ? fDay.format(new Date(next.ko))+" kl. "+fTime.format(new Date(next.ko)) : "";
  $("strip").innerHTML =
    '<div><small>Færdige</small><b class="num">'+fin+' / '+w.matches.length+'</b></div>'+
    '<div><small>I gang nu</small><b class="num" style="color:'+(live?"var(--live)":"inherit")+'">'+live+'</b></div>'+
    '<div><small>Fører'+(live?" (lige nu)":"")+'</small><b style="font-size:20px">'+esc(leadTxt||"–")+'</b></div>'+
    '<div><small>Næste kamp</small><span class="nx">'+nx+'</span><small style="text-transform:none;letter-spacing:0">'+nxs+'</small></div>';
}
function renderMe(){
  var el=$("me-pick");
  el.innerHTML='<span>Fremhæv mig:</span>'+DATA.players.map(function(p){
    return '<button class="chip" data-me="'+esc(p)+'" aria-pressed="'+(view.me===p)+'">'+esc(p)+'</button>';}).join("");
}
function statusHtml(m){
  var r=m.res||{}, ko=m.ko?new Date(m.ko):null;
  if(isFinal(r)) return '<b class="num">'+r.h+'–'+r.a+'</b><span class="st ft">Slut</span>';
  if(isLive(r)) return '<b class="num">'+r.h+'–'+r.a+'</b><span class="st live">'+(r.s==="HT"?"Pause":(r.min?esc(r.min)+"'":"Live"))+'</span>';
  if(r.s==="PP") return '<span class="ko">–</span><span class="st">Udsat</span>';
  if(!ko) return '<span class="ko">–:–</span><span class="st">Tid følger</span>';
  var started = ko.getTime() < Date.now();
  return '<span class="ko num">'+fTime.format(ko)+'</span><span class="st">'+(started?"Startet · afventer":esc(fDay.format(ko)))+'</span>';
}
function renderMatches(w){
  var html="", me=view.me;
  w.matches.forEach(function(m){
    var r=m.res||{}, s=signOf(r), fin=isFinal(r), live=isLive(r);
    var cnt={"1":[], "X":[], "2":[]};
    DATA.players.forEach(function(p){ var t=tipOf(m,p); if(cnt[t]) cnt[t].push(p); });
    var mine = me? tipOf(m,me) : null;
    var signs = ["1","X","2"].map(function(k){
      var c = "sg"+((fin||live)&&s===k?" cur":"")+(live&&s===k?" prov":"")+(mine===k?" mine":"");
      return '<span class="'+c+'"><i>'+k+'</i><em class="num">'+cnt[k].length+'</em></span>';
    }).join("");
    var det = ["1","X","2"].map(function(k){
      return '<div><h4>'+k+' · '+cnt[k].length+'</h4><div class="ppl">'+(cnt[k].length?cnt[k].map(function(p){
        var cls = (fin||live) ? (s===k?"hit":"miss") : "";
        if(p===me) cls+=" me-tag";
        return '<span class="'+cls+'">'+esc(p)+'</span>';}).join(""):'<span style="background:none;color:var(--muted)">ingen</span>')+'</div></div>';
    }).join("");
    var label = esc(m.home)+" mod "+esc(m.away);
    html += '<article class="m'+(live?" is-live":"")+(view.open[m.n]?" open":"")+'" data-n="'+m.n+'">'+
      '<button aria-expanded="'+(!!view.open[m.n])+'" aria-label="Kamp '+m.n+': '+label+'">'+
      '<span class="nr num">'+m.n+'</span>'+
      '<span class="teams"><strong>'+esc(m.home)+' – '+esc(m.away)+'</strong><small>'+esc(m.lg||"")+(mine?' · dit tip: <b style="color:var(--ink)">'+esc(mine)+'</b>':'')+'</small></span>'+
      '<span class="score">'+statusHtml(m)+'</span>'+
      '<span class="signs">'+signs+'</span></button>'+
      '<div class="detail">'+det+'</div></article>';
  });
  $("matches").innerHTML=html;
}
function renderBoard(w){
  var rows=standings(w.id), anyLive=w.matches.some(function(m){return isLive(m.res);});
  var key = anyLive?"prov":"fin", rk=rankBy(rows,key), rkBefore=rankBy(rows,"before");
  var showMove = weekIndex(w.id)>0 || Object.keys(DATA.prior||{}).length>0;
  rows.sort(function(a,b){ return b[key]-a[key] || b.fin-a.fin || a.p.localeCompare(b.p); });
  var top = Math.max(1, rows[0] ? rows[0][key] : 1);
  var head = '<thead><tr><th>#</th><th>Deltager</th><th>'+esc(w.label)+'</th><th>Total</th><th title="Hvis alle resterende kampe går ens vej">Maks</th></tr></thead>';
  var body = rows.map(function(r){
    var mv="";
    if(showMove){ var d=rkBefore[r.p]-rk[r.p]; if(d>0) mv='<span class="mv up">▲'+d+'</span>'; else if(d<0) mv='<span class="mv dn">▼'+(-d)+'</span>'; }
    var wkLive = r.wk.prov>r.wk.fin ? '<span class="lv">+'+(r.wk.prov-r.wk.fin)+' live</span>' : '';
    var total = anyLive ? r.prov : r.fin;
    return '<tr class="'+(r.p===view.me?"me":"")+'">'+
      '<td class="rk num">'+rk[r.p]+'</td>'+
      '<td class="nm">'+esc(r.p)+mv+'<span class="bar"><i style="width:'+Math.round(100*r[key]/top)+'%"></i></span></td>'+
      '<td class="wk num"><b>'+r.wk.fin+'</b>'+wkLive+'</td>'+
      '<td class="tot num">'+total+'</td>'+
      '<td class="mx num">'+r.max+'</td></tr>';
  }).join("");
  $("board").innerHTML = head+'<tbody>'+body+'</tbody>';
  var weeksDone = weekIndex(w.id)+1;
  $("board-sub").textContent = anyLive ? "Lige nu, hvis kampene slutter sådan" : "1 point pr. rigtigt tegn · "+weeksDone+(weeksDone===1?" kupon":" kuponer");
  $("board-note").textContent = "Total tæller kun afsluttede kampe"+(anyLive?", plus point fra igangværende kampe markeret med orange.":".")+" Maks viser hvor mange point man kan nå op på denne uge.";
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var chip=e.target.closest("[data-me]");
  if(chip){ var p=chip.getAttribute("data-me"); view.me = view.me===p?null:p;
    try{ view.me?localStorage.setItem("tips-me",view.me):localStorage.removeItem("tips-me"); }catch(x){}
    render(); return; }
  var tab=e.target.closest(".tabs [data-view]");
  if(tab){ var v=tab.getAttribute("data-view"); $("cols").dataset.view=v;
    document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected", String(b===tab));});
    try{localStorage.setItem("tips-view",v);}catch(x){} return; }
  var mb=e.target.closest(".m > button");
  if(mb){ var n=mb.parentNode.getAttribute("data-n"); view.open[n]=!view.open[n]; mb.parentNode.classList.toggle("open"); mb.setAttribute("aria-expanded", String(!!view.open[n])); }
});
(function syncTabs(){ var v=$("cols").dataset.view; document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected", String(b.getAttribute("data-view")===v));}); })();
setInterval(function(){ var w=weekById(view.week); if(w){ renderStrip(w); renderMatches(w);} }, 60000);
render();

/* ---------- hent nye data hvert minut ---------- */
var lastStamp = DATA.updated;
function poll(){
  fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d || d.updated===lastStamp) return;
    lastStamp=d.updated; var keepWeek = view.week===DATA.current;
    DATA=d; if(keepWeek || !weekById(view.week)) view.week=d.current; render();
  }).catch(function(){});
}
poll(); setInterval(poll, 60000);
})();
</script>
